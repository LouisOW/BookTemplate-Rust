name: CI
on:
  push:
    branches: ['**']

env:
  MDBOOK_VERSION: 0.5.2
  MDBOOK_QUIZ_VERSION: 0.5.0

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: 20

    - uses: pnpm/action-setup@v4
      with:
        version: 8

    - name: Install mdBook and mdbook-quiz
      run: |
        mkdir bin
        curl -sSL https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz | tar -xz --directory=bin
        curl -sSL https://github.com/cognitive-engineering-lab/mdbook-quiz/releases/download/v${MDBOOK_QUIZ_VERSION}/mdbook-quiz_x86_64-unknown-linux-gnu_full.tar.gz | tar -xz --directory=bin
        echo "$(pwd)/bin" >> ${GITHUB_PATH}

    # Uncomment if your book uses Aquascope (Rust-only); see GUIDE.md §6.
    # - name: Install Aquascope
    #   run: see https://github.com/cognitive-engineering-lab/aquascope#installation

    - name: Install mdbook-trpl preprocessors
      run: cargo install --path packages/mdbook-trpl

    - name: Build JS extensions
      run: cd js-extensions && pnpm init-repo

    - name: Test Rust code blocks
      run: mdbook test

    - name: Build book
      run: mdbook build

    - name: Deploy to GitHub Pages
      if: ${{ github.ref == 'refs/heads/main' }}
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./book
        # cname: your.domain.example
